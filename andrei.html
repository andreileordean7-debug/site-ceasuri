<!DOCTYPE html>
<head>
<title>Lumea Ceasurilor</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

header{
background:black;
color:white;
text-align:center;
padding:20px;
}

header h1{
font-size:45px;
}

nav{
background:#333;
padding:10px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
}

.container{
display:flex;
margin:20px;
gap:20px;
}

.imagine{
flex:2;
background:white;
padding:20px;
border:2px solid black;
}

.imagine img{
width:100%;
height:400px;
object-fit:cover;
}

.info{
flex:1;
background:white;
padding:20px;
border:2px solid black;
}

.info h2{
text-align:center;
margin-bottom:20px;
}
.info ul{
font-size:20px;
}

.info li{
margin:15px 0;
}

@media(max-width:992px){

.cards{
grid-template-columns:repeat(2,1fr);
}

header h1{
font-size:40px;
}

.hero-text h2{
font-size:30px;
}

}


@media(max-width:600px){

nav{
flex-direction:column;
}

.cards{
grid-template-columns:1fr;
}

.hero{
flex-direction:column;
text-align:center;
}

header h1{
font-size:30px;
}

.hero-text h2{
font-size:25px;
}

.info{
flex-direction:column;
}


</style>

</head>

<body>

<header>
<h1>⌚ LUMEA CEASURILOR</h1>
<p>Cele mai elegante ceasuri</p>
</header>

<div class="container">

<div class="imagine">

<img src="ceas.jpg">

</div>

<div class="info">

<h2>BEST WATCHES</h2>

<ul>
<li>Design modern</li>
<li>Rezistente la apă</li>
<li>Materiale premium</li>
<li>Mișcare automată</li>
<li>Branduri celebre</li>
</ul>

</div>

</div>


</body>
</html>
